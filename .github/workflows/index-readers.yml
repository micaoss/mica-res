name: index-readers
# One question, asked once, authorised by the coordinator on 2026-09-20: does
# anything outside this workspace read the published index document? It queries
# our own account about our own zone through Cloudflare's GraphQL analytics
# API, publishes nothing and deletes nothing. The answer it can give is "no
# request in the window the dataset retains", never "nothing reads it": a
# negative claim inherits the aperture of the query, and an analytics retention
# window is an aperture. Delete this workflow once the answer is recorded.
on:
  workflow_dispatch:
    inputs:
      days:
        description: How many days back to ask about
        type: string
        default: '30'
permissions:
  contents: read
jobs:
  ask:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Ask the zone who requested /index/
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DAYS: ${{ inputs.days }}
        run: |
          set -euo pipefail
          zone=$(curl -sS -H "authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            'https://api.cloudflare.com/client/v4/zones?name=micaos.dev' | jq -r '.result[0].id // empty')
          if [ -z "${zone}" ]; then
            echo 'the token cannot read the zone list; the question needs Zone:Read'
            exit 1
          fi
          since=$(date -u -d "${DAYS} days ago" +%Y-%m-%dT%H:%M:%SZ)
          echo "asking about ${since} onwards"
          jq -n --arg zone "${zone}" --arg since "${since}" '{
            query: "query($zone: String!, $since: Time!) { viewer { zones(filter: {zoneTag: $zone}) { httpRequestsAdaptiveGroups(limit: 200, filter: {datetime_geq: $since, clientRequestHTTPHost: \"res.micaos.dev\"}, orderBy: [count_DESC]) { count dimensions { clientRequestPath clientRequestHTTPHost } } } } }",
            variables: { zone: $zone, since: $since }
          }' > /tmp/query.json
          curl -sS -H "authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'content-type: application/json' \
            --data @/tmp/query.json https://api.cloudflare.com/client/v4/graphql > /tmp/answer.json
          jq -r '.errors // empty | .[] | "API error: \(.message)"' /tmp/answer.json
          echo '--- paths under /index/ ---'
          jq -r '[.data.viewer.zones[0].httpRequestsAdaptiveGroups[]? | select(.dimensions.clientRequestPath | startswith("/index/"))] | if length == 0 then "none in the window" else (.[] | "\(.count)\t\(.dimensions.clientRequestPath)") end' /tmp/answer.json
          echo '--- the ten most requested paths, for scale ---'
          jq -r '[.data.viewer.zones[0].httpRequestsAdaptiveGroups[]?] | sort_by(-.count) | .[0:10][] | "\(.count)\t\(.dimensions.clientRequestPath)"' /tmp/answer.json
