name: infra
# Provisioning, by hand only (`workflow_dispatch`), in the shape the website
# Worker of `mica` already uses: report what the token may do, create the
# bucket if it is missing, deploy the Worker with cloudflare/wrangler-action at
# a pinned wrangler, and upload the site skeleton. It publishes no artefact and
# deletes nothing. The gates live in ci.yml.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the Worker and the site skeleton as well as reporting the bucket
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: infra
env:
  # Pinned so a deploy is reproducible; checked at the wrangler release when
  # this workflow is touched.
  WRANGLER_VERSION: '4.132.0'
  BUCKET: res-micaos-dev
jobs:
  provision:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      # What the token is allowed to do, as policy names only. No secret value
      # is ever echoed.
      - name: Report the token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          verify=$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)
          echo "${verify}" | jq '{success, status: .result.status, messages: [.messages[]?.message]}'

      - name: Create the bucket if it is missing
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets"
          existing=$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${base}/${BUCKET}")
          if [ "$(echo "${existing}" | jq -r .success)" = true ]; then
            echo "bucket ${BUCKET} exists"
            echo "${existing}" | jq '.result | {name, location, storage_class, creation_date}'
            exit 0
          fi
          echo "${existing}" | jq '{success, errors: [.errors[]?.message]}'
          created=$(curl -sS -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' --data "{\"name\":\"${BUCKET}\"}" "${base}")
          echo "${created}" | jq '{success, errors: [.errors[]?.message], result: (.result | {name, location})}'
          [ "$(echo "${created}" | jq -r .success)" = true ]

      - name: Deploy the Worker
        if: inputs.deploy
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          # Bound on every deploy, so the bearer the write endpoint checks is
          # provably the one this repository holds: the user sets the
          # repository secret once and a deploy pushes it to the Worker. Nobody
          # runs `wrangler secret put` by hand.
          secrets: |
            WRITE_TOKEN
        env:
          WRITE_TOKEN: ${{ secrets.WRITE_TOKEN }}

      # The site skeleton renders an empty bucket: phase 0 mirrors no bytes and
      # the pages must not claim otherwise.
      - name: Render the site skeleton
        if: inputs.deploy
        run: bun src/cli.ts site --out "${RUNNER_TEMP}/site"

      - name: Upload the site index page
        if: inputs.deploy
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: r2 object put ${{ env.BUCKET }}/site/index.html --file ${{ runner.temp }}/site/index.html --content-type text/html --remote

      - name: Upload the upstream page
        if: inputs.deploy
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: r2 object put ${{ env.BUCKET }}/site/upstream.html --file ${{ runner.temp }}/site/upstream.html --content-type text/html --remote

      - name: Report what the credentials would not allow
        if: always()
        run: |
          set -euo pipefail
          echo 'The design asks for two credentials this workflow does not have:'
          echo '  - a bucket-scoped R2 token with no delete permission, for CI;'
          echo '  - a separate delete-capable token held by the user, out of CI.'
          echo 'WRITE_TOKEN must exist twice: as this repository secret and,'
          echo 'bound by the deploy step above, on the Worker itself.'
