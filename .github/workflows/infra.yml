name: infra
# Provisioning and deployment of the resource service, by hand only
# (`workflow_dispatch`): report what the token may do, create the two buckets
# if they are missing, give the public bucket its CORS rule and its custom
# domain (dl.res.micaos.dev), build both SPAs, and deploy the Worker with its
# secrets bound in the same run. It publishes no resource and deletes nothing.
# The gates live in ci.yml and workers.yml.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Build and deploy the Worker as well as provisioning the buckets
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: infra
env:
  # Pinned so a deploy is reproducible; checked at the wrangler release when
  # this workflow is touched.
  WRANGLER_VERSION: '4.132.0'
  PUBLIC_BUCKET: res-micaos-dev
  PROTECT_BUCKET: protect-res-micaos-dev
  DOWNLOAD_DOMAIN: dl.res.micaos.dev
  ZONE_NAME: micaos.dev
jobs:
  provision:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      # What the token is allowed to do, as policy names only. No secret value
      # is ever echoed.
      - name: Report the token
        run: |
          set -euo pipefail
          verify=$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)
          echo "${verify}" | jq '{success, status: .result.status, messages: [.messages[]?.message]}'

      - name: Create the buckets if they are missing
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets"
          for bucket in "${PUBLIC_BUCKET}" "${PROTECT_BUCKET}"; do
            existing=$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${base}/${bucket}")
            if [ "$(echo "${existing}" | jq -r .success)" = true ]; then
              echo "bucket ${bucket} exists"
              continue
            fi
            created=$(curl -sS -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' --data "{\"name\":\"${bucket}\"}" "${base}")
            echo "${created}" | jq '{success, errors: [.errors[]?.message], result: (.result | {name, location})}'
            [ "$(echo "${created}" | jq -r .success)" = true ]
          done

      # Public objects are fetched straight from the bucket by browsers and
      # tools on other origins; the protected bucket gets no CORS and no domain.
      - name: Allow cross-origin reads of the public bucket
        run: |
          set -euo pipefail
          answer=$(curl -sS -X PUT -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' \
            --data '{"rules":[{"allowed":{"origins":["*"],"methods":["GET","HEAD"],"headers":["range","if-none-match","if-modified-since"]},"exposeHeaders":["content-length","content-range","etag","last-modified"],"maxAgeSeconds":86400}]}' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${PUBLIC_BUCKET}/cors")
          echo "${answer}" | jq '{success, errors: [.errors[]?.message]}'
          [ "$(echo "${answer}" | jq -r .success)" = true ]

      - name: Attach the download domain to the public bucket
        run: |
          set -euo pipefail
          api=https://api.cloudflare.com/client/v4
          zone=$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${api}/zones?name=${ZONE_NAME}&account.id=${CLOUDFLARE_ACCOUNT_ID}" | jq -r '.result[0].id // empty')
          if [ -z "${zone}" ]; then
            echo "::error::the zone ${ZONE_NAME} is not visible to this token"
            exit 1
          fi
          domains="${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${PUBLIC_BUCKET}/domains/custom"
          if curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${domains}" | jq -e --arg d "${DOWNLOAD_DOMAIN}" '.result.domains[]? | select(.domain == $d)' >/dev/null; then
            echo "${DOWNLOAD_DOMAIN} is attached"
            exit 0
          fi
          answer=$(curl -sS -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' \
            --data "{\"domain\":\"${DOWNLOAD_DOMAIN}\",\"zoneId\":\"${zone}\",\"enabled\":true}" "${domains}")
          echo "${answer}" | jq '{success, errors: [.errors[]?.message]}'
          [ "$(echo "${answer}" | jq -r .success)" = true ]

      # The migrations bundle is committed; a stale one would make the Worker
      # run a different schema than the tests ran against.
      - name: Check the Durable Object migrations bundle is current
        if: inputs.deploy
        working-directory: apps/api
        run: bun run db:check-migrations

      - name: Build the home page and the admin SPA
        if: inputs.deploy
        run: bun run build:worker

      # Only what actually has a value is passed on. An empty var or secret
      # would be published as an empty string, which the config schema refuses
      # at boot. `R2_*` are optional: without them copies stream
      # binding-to-binding, uploads come through the service and protected
      # downloads are streamed rather than signed. `CF_PURGE_TOKEN` is optional
      # too: without it CDN purges are marked skipped.
      - name: Decide what to deploy with
        if: inputs.deploy
        id: plan
        env:
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CF_PURGE_TOKEN: ${{ secrets.CF_PURGE_TOKEN }}
          RES_KEY_KEK: ${{ secrets.RES_KEY_KEK }}
          OAUTH_ISSUER: ${{ vars.OAUTH_ISSUER }}
          OAUTH_CLIENT_ID: ${{ vars.OAUTH_CLIENT_ID }}
          DEFAULT_ADMIN: ${{ vars.DEFAULT_ADMIN }}
          CF_ZONE_ID: ${{ vars.CF_ZONE_ID }}
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          command="deploy"
          for name in OAUTH_ISSUER OAUTH_CLIENT_ID DEFAULT_ADMIN CF_ZONE_ID R2_ACCOUNT_ID; do
            if [ -n "${!name}" ]; then
              command="${command} --var ${name}:${!name}"
            else
              echo "::warning::${name} is not set; deploying without it"
            fi
          done
          {
            echo "command=${command}"
            echo "secrets<<EOF"
            for name in OAUTH_CLIENT_SECRET R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY CF_PURGE_TOKEN RES_KEY_KEK; do
              if [ -n "${!name}" ]; then
                echo "${name}"
              else
                echo "::warning::${name} is not set; deploying without it"
              fi
            done
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Deploy the Worker
        if: inputs.deploy
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          # Non-secret configuration travels as vars in the same deploy.
          command: ${{ steps.plan.outputs.command }}
          # Bound on every deploy from the repository's secrets, so what the
          # Worker holds is provably what the repository holds. Nobody runs
          # `wrangler secret put` by hand.
          secrets: ${{ steps.plan.outputs.secrets }}
        env:
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CF_PURGE_TOKEN: ${{ secrets.CF_PURGE_TOKEN }}
          RES_KEY_KEK: ${{ secrets.RES_KEY_KEK }}

      - name: Check the deployment answers
        if: inputs.deploy
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            status=$(curl -sS -o /dev/null -w '%{http_code}' https://res.micaos.dev/admin/api/health || true)
            [ "${status}" = 200 ] && break
            sleep 6
          done
          echo "health: ${status}"
          [ "${status}" = 200 ]
          curl -sS -o /dev/null -w "home: %{http_code}\n" https://res.micaos.dev/
          curl -sS -o /dev/null -w "catalog: %{http_code}\n" https://res.micaos.dev/.well-known/res.json
