name: sync
# The mirror sync. On a schedule and by hand it enumerates what the service
# should hold from the producers' locks and releases; with `apply` it publishes
# the missing objects through the control plane with a `res:publish` API token
# (bytes are pulled server-side or put to presigned R2 URLs). It never deletes
# anything: the token's scope has no delete route.
on:
  schedule:
    # Daily, after the usual release hours.
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: Upload the missing objects instead of only enumerating them
        type: boolean
        default: false
      kinds:
        description: Object kinds to upload (phase 1 is deb and source)
        type: string
        default: deb,source
      limit:
        description: Upload at most this many objects (blank for all)
        type: string
        default: ''
      sizes:
        description: Ask every origin for the size of each object (implied by apply)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: sync
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Enumerate and, when asked, upload
        run: |
          set -euo pipefail
          args=(sync --out "${RUNNER_TEMP}/sync")
          [ "${SIZES}" = true ] && args+=(--sizes)
          if [ "${APPLY}" = true ]; then
            args+=(--apply --kinds "${KINDS}")
            [ -n "${LIMIT}" ] && args+=(--limit "${LIMIT}")
          fi
          bun packages/mica-sync/src/cli.ts "${args[@]}"
        env:
          APPLY: ${{ inputs.apply || false }}
          KINDS: ${{ inputs.kinds || 'deb,source' }}
          LIMIT: ${{ inputs.limit }}
          SIZES: ${{ inputs.sizes || false }}
          GITHUB_TOKEN: ${{ github.token }}
          MICA_RES_TOKEN: ${{ secrets.MICA_RES_TOKEN }}
      # The consumer contract for a git pack, walked against the live mirror:
      # fetch the manifest, join the chunks, import, check out the pinned
      # commit, fsck. What mica-boards implements is a path verified here.
      - name: Verify a mirrored git pack end to end
        run: bun packages/mica-sync/src/cli.ts verify-pack

      # The published invariant check: it reads the edge's catalog listings and
      # the download host, neither of which this run produced, and fails the
      # run on any disagreement. A writer cannot catch an error in its own
      # model of the world.
      - name: Audit the published catalog against the download host
        run: bun packages/mica-sync/src/cli.ts audit

      # Bit-identity proven by a client that refuses rather than reports: for
      # every mirrored build-env `base` image, pull it by digest from the
      # mirror and compare what docker says it got with what ghcr serves for
      # the same tag. Docker verifies every layer digest as it pulls, so a
      # wrong byte fails the pull.
      - name: Pull a mirrored build-env image by digest and compare with ghcr
        run: |
          set -euo pipefail
          snapshot=$(ls "${RUNNER_TEMP}"/sync/index-*.json | tail -1)
          token=$(curl -sS 'https://ghcr.io/token?scope=repository:micaoss/mica-build-env:pull&service=ghcr.io' | jq -r .token)
          jq -r '.objects[] | select(any(.readable[]; test("^/v2/micaoss/mica-build-env/manifests/base[.]"))) | [.sha256, (.readable[] | select(startswith("/v2/")))] | @tsv' "${snapshot}" \
          | while IFS=$'\t' read -r digest readable; do
              tag=${readable##*/}
              start=$(date +%s%3N)
              pulled=$(docker pull "res.micaos.dev/micaoss/mica-build-env@sha256:${digest}" | awk '/^Digest:/{print $2}')
              elapsed=$(( $(date +%s%3N) - start ))
              upstream=$(curl -sS -o /dev/null -D- -H "Authorization: Bearer ${token}" \
                -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json' \
                "https://ghcr.io/v2/micaoss/mica-build-env/manifests/${tag}" | awk 'BEGIN{IGNORECASE=1}/^docker-content-digest:/{print $2}' | tr -d '\r')
              echo "  ${tag}: mirror pull ${pulled} in ${elapsed} ms, ghcr serves ${upstream}"
              [ "sha256:${digest}" = "${pulled}" ] || { echo "  digest mismatch against the index"; exit 1; }
              [ "${pulled}" = "${upstream}" ] || { echo "  digest differs from ghcr"; exit 1; }
            done

      # The registry read paths, timed from a runner, because the development
      # network cannot reach the zone: a tag resolves through the index (now
      # edge-cached) and a digest does not resolve anything.
      - name: Time the registry tag and digest paths
        run: |
          set -euo pipefail
          snapshot=$(ls "${RUNNER_TEMP}"/sync/index-*.json | tail -1)
          tag=$(jq -r '[.objects[].readable[] | select(startswith("/v2/"))] | .[0] // empty' "${snapshot}")
          digest=$(jq -r '[.objects[] | select(.mediaType != null) | select(.mediaType | test("manifest.list|image.index"))] | .[0].sha256 // empty' "${snapshot}")
          [ -n "${tag}" ] || { echo "no registry tag in the index"; exit 0; }
          for i in 1 2; do
            curl -sS -o /dev/null -w "  by tag    ${i}: %{time_total}s\n" "https://res.micaos.dev${tag}?cold=${GITHUB_RUN_ID}${i}"
          done
          for i in 1 2; do
            curl -sS -o /dev/null -w "  by digest ${i}: %{time_total}s\n" "https://res.micaos.dev/v2/micaoss/mica-build-env/manifests/sha256:${digest}?cold=${GITHUB_RUN_ID}${i}"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: sync-${{ github.run_id }}
          path: ${{ runner.temp }}/sync
