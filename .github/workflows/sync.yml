name: sync
# The mirror sync. On a schedule and by hand it enumerates what the service
# should hold from the producers' locks and releases; with `apply` it publishes
# the missing objects through the control plane with a `res:publish` API token
# (bytes are pulled server-side or put to presigned R2 URLs). It never deletes
# anything: the token's scope has no delete route.
on:
  schedule:
    # Daily, after the usual release hours.
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: Upload the missing objects instead of only enumerating them
        type: boolean
        default: false
      kinds:
        description: Object kinds to upload (phase 1 is deb and source)
        type: string
        default: deb,source
      limit:
        description: Upload at most this many objects (blank for all)
        type: string
        default: ''
      sizes:
        description: Ask every origin for the size of each object (implied by apply)
        type: boolean
        default: false
      repair:
        description: Republish a git pack chunk that does not resolve under its own name
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: sync
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      # Ask what the service HOLDS, not whether a path answers: a rendered but
      # empty namespace listing says the service is up, its routes work and it
      # holds nothing, which no 404 can say. And note that the answer EXPIRES
      # -- a listing measured empty at 20:06 held 175 objects ten minutes
      # later. Extend this with discriminating questions, not with more paths.
      - name: Probe the legacy and current paths
        run: |
          set -uo pipefail
          probe() { printf '  %-78s %s\n' "$1" "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$1" || echo unreachable)"; }
          echo 'legacy (res host, no redirect followed):'
          probe https://res.micaos.dev/d/upstream/git/cx3576-rkbin/ecb4fcbe954edf38b3ae037d5de6d9f5bccf81f4.json
          probe https://res.micaos.dev/d/mica/uefi-x64/20260916-0845/mica-uefi-x64-dev-20260916-0845.img.gz
          probe https://res.micaos.dev/index/current.json
          echo 'current (res host, redirects to the download host):'
          probe https://res.micaos.dev/upstream/git/cx3576-rkbin/ecb4fcbe954edf38b3ae037d5de6d9f5bccf81f4.json
          probe https://res.micaos.dev/mica/uefi-x64/20260916-0845/mica-uefi-x64-dev-20260916-0845.img.gz
          echo 'current (download host, direct from R2):'
          probe https://dl.res.micaos.dev/upstream/git/cx3576-rkbin/ecb4fcbe954edf38b3ae037d5de6d9f5bccf81f4.json
          probe https://dl.res.micaos.dev/mica/uefi-x64/20260916-0845/mica-uefi-x64-dev-20260916-0845.img.gz
          echo 'by digest (res host only; a hit is a 302 to the download host):'
          probe https://res.micaos.dev/blob/1e/1e2b5f31fc826e1af25e2a12e37cd8d361ff25feaf224c6bbef3cc5d6cd2596b
          probe https://dl.res.micaos.dev/blob/1e/1e2b5f31fc826e1af25e2a12e37cd8d361ff25feaf224c6bbef3cc5d6cd2596b
          echo 'the chunk the coordinator reports 404: plain, then cache-busted, both hosts:'
          C=f717995cb7dcd8998ab15516b8006aea09cfde0d
          probe "https://dl.res.micaos.dev/upstream/git/uefi-x64-kernel/${C}.pack.00"
          probe "https://dl.res.micaos.dev/upstream/git/uefi-x64-kernel/${C}.pack.00?cold=${GITHUB_RUN_ID}"
          probe "https://res.micaos.dev/upstream/git/uefi-x64-kernel/${C}.pack.00"
          probe "https://dl.res.micaos.dev/upstream/git/uefi-arm64-kernel/${C}.pack.00"
          echo 'a digest lookup, followed to the end (does the key it names serve bytes?):'
          printf '  %s\n' "$(curl -sSL -o /dev/null --max-time 30 -w 'final %{http_code} after %{num_redirects} redirect(s): %{url_effective}' https://res.micaos.dev/blob/1e/1e2b5f31fc826e1af25e2a12e37cd8d361ff25feaf224c6bbef3cc5d6cd2596b || echo unreachable)"
          echo 'what the service actually holds, per namespace:'
          for ns in upstream mica build-env oci status; do
            printf '  %-12s %s\n' "$ns" "$(curl -sS -H 'accept: application/json' --max-time 20 "https://res.micaos.dev/$ns/" | head -c 240)"
          done

      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Enumerate and, when asked, upload
        run: |
          set -euo pipefail
          args=(sync --out "${RUNNER_TEMP}/sync")
          [ "${SIZES}" = true ] && args+=(--sizes)
          if [ "${APPLY}" = true ]; then
            args+=(--apply --kinds "${KINDS}")
            [ -n "${LIMIT}" ] && args+=(--limit "${LIMIT}")
          fi
          bun packages/mica-sync/src/cli.ts "${args[@]}"
        env:
          APPLY: ${{ inputs.apply || false }}
          KINDS: ${{ inputs.kinds || 'deb,source' }}
          LIMIT: ${{ inputs.limit }}
          SIZES: ${{ inputs.sizes || false }}
          GITHUB_TOKEN: ${{ github.token }}
          MICA_RES_TOKEN: ${{ secrets.MICA_RES_TOKEN }}
      # The consumer contract for a git pack, walked against the live mirror:
      # fetch the manifest, join the chunks, import, check out the pinned
      # commit, fsck. What mica-boards implements is a path verified here.
      - name: Verify a mirrored git pack end to end
        run: bun packages/mica-sync/src/cli.ts verify-pack

      # The published invariant check: it reads the edge's catalog listings and
      # the download host, neither of which this run produced, and fails the
      # run on any disagreement. A writer cannot catch an error in its own
      # model of the world.
      # The catalog against the producers' locks: what agrees, what the locks
      # name and the catalog lacks, and -- the column nobody has looked at --
      # what the catalog holds that no lock names. Read-only and token-free.
      - name: Reconcile the catalog against the locks
        run: bun packages/mica-sync/src/cli.ts reconcile
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # The CONTRACT, not the object set: every chunk a git-pack manifest
      # declares must resolve under that manifest's own name. An object-set
      # audit cannot see a missing NAME -- it cancels out on both sides -- and
      # that is how uefi-x64-kernel pack.00 was absent while everything
      # reported clean.
      - name: Walk the git pack contract
        run: bun packages/mica-sync/src/cli.ts packs ${{ inputs.repair && '--repair' || '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MICA_RES_TOKEN: ${{ secrets.MICA_RES_TOKEN }}

      # The mirrors member, checked the way a device would: fetch the mirror URL
      # the index names and compare the bytes' digest with the one the index
      # states beside it. A mirror is a source and never a trust anchor, which
      # is only true if somebody verifies it.
      - name: Verify the index mirror URLs by digest
        run: bun packages/mica-sync/src/cli.ts mirrors
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Audit the published catalog against the download host
        run: bun packages/mica-sync/src/cli.ts audit

      # Bit-identity proven by a client that refuses rather than reports: for
      # every mirrored build-env `base` image, pull it by digest from the
      # mirror and compare what docker says it got with what ghcr serves for
      # the same tag. Docker verifies every layer digest as it pulls, so a
      # wrong byte fails the pull.
      - name: Pull a mirrored build-env image by digest and compare with ghcr
        run: |
          set -euo pipefail
          snapshot=$(ls "${RUNNER_TEMP}"/sync/index-*.json | tail -1)
          token=$(curl -sS 'https://ghcr.io/token?scope=repository:micaoss/mica-build-env:pull&service=ghcr.io' | jq -r .token)
          jq -r '.objects[] | select(any(.readable[]; test("^/v2/micaoss/mica-build-env/manifests/base[.]"))) | [.sha256, (.readable[] | select(startswith("/v2/")))] | @tsv' "${snapshot}" \
          | while IFS=$'\t' read -r digest readable; do
              tag=${readable##*/}
              start=$(date +%s%3N)
              pulled=$(docker pull "res.micaos.dev/micaoss/mica-build-env@sha256:${digest}" | awk '/^Digest:/{print $2}')
              elapsed=$(( $(date +%s%3N) - start ))
              upstream=$(curl -sS -o /dev/null -D- -H "Authorization: Bearer ${token}" \
                -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json' \
                "https://ghcr.io/v2/micaoss/mica-build-env/manifests/${tag}" | awk 'BEGIN{IGNORECASE=1}/^docker-content-digest:/{print $2}' | tr -d '\r')
              echo "  ${tag}: mirror pull ${pulled} in ${elapsed} ms, ghcr serves ${upstream}"
              [ "sha256:${digest}" = "${pulled}" ] || { echo "  digest mismatch against the index"; exit 1; }
              [ "${pulled}" = "${upstream}" ] || { echo "  digest differs from ghcr"; exit 1; }
            done

      # The registry read paths, timed from a runner, because the development
      # network cannot reach the zone: a tag resolves through the index (now
      # edge-cached) and a digest does not resolve anything.
      - name: Time the registry tag and digest paths
        run: |
          set -euo pipefail
          snapshot=$(ls "${RUNNER_TEMP}"/sync/index-*.json | tail -1)
          tag=$(jq -r '[.objects[].readable[] | select(startswith("/v2/"))] | .[0] // empty' "${snapshot}")
          digest=$(jq -r '[.objects[] | select(.mediaType != null) | select(.mediaType | test("manifest.list|image.index"))] | .[0].sha256 // empty' "${snapshot}")
          [ -n "${tag}" ] || { echo "no registry tag in the index"; exit 0; }
          for i in 1 2; do
            curl -sS -o /dev/null -w "  by tag    ${i}: %{time_total}s\n" "https://res.micaos.dev${tag}?cold=${GITHUB_RUN_ID}${i}"
          done
          for i in 1 2; do
            curl -sS -o /dev/null -w "  by digest ${i}: %{time_total}s\n" "https://res.micaos.dev/v2/micaoss/mica-build-env/manifests/sha256:${digest}?cold=${GITHUB_RUN_ID}${i}"
          done
      # Which artefact the mirror actually holds bytes of. Read-only.
      - name: Report what the mirror covers
        run: bun packages/mica-sync/src/cli.ts coverage

      # Is the run history in the bucket, and is it unbroken? A gap matters
      # more than a count.
      - name: Report the run history and its gaps
        run: bun packages/mica-sync/src/cli.ts history
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # The prunable set, as three lists and no opinion. Read-only.
      - name: Derive the prunable set
        run: bun packages/mica-sync/src/cli.ts prunable
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v7
        with:
          name: sync-${{ github.run_id }}
          path: ${{ runner.temp }}/sync
