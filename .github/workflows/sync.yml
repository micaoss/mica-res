name: sync
# The mirror sync. Dry run on a schedule and by hand; it enumerates what the
# bucket should hold from the producers' locks and releases, and in phase 0 it
# uploads nothing.
on:
  schedule:
    # Daily, after the usual release hours.
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      sizes:
        description: Ask every origin for the size of each object (slow)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: sync
jobs:
  dry-run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun src/cli.ts sync ${{ inputs.sizes && '--sizes' || '' }} --out "${RUNNER_TEMP}/sync"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        with:
          name: sync-dry-run
          path: ${{ runner.temp }}/sync
