name: workers

# Cloudflare Workers is the secondary runtime: the app also runs on a single
# Durable Object that owns its SQLite database (see docs/develop/runtime.md).
# This workflow proves that target still works.
#
#  - `smoke-local` always runs. It boots the Worker in workerd through
#    `wrangler dev`, so it needs no Cloudflare account.
#  - `deploy` is manual (workflow_dispatch only). It deploys to Cloudflare
#    and runs the same suite against the live URL. A push never publishes.

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "tests/workers/**"
      - ".github/workflows/workers.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "tests/workers/**"
      - ".github/workflows/workers.yml"
  workflow_dispatch:

concurrency:
  group: workers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.2"
  NODE_VERSION: "24.21.0"

jobs:
  smoke-local:
    name: workerd smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The migrations bundle is committed; a stale one would make the
      # Worker run a different schema than the Bun build.
      - name: Check the Durable Object migrations bundle is current
        working-directory: apps/api
        run: bun run db:check-migrations

      # `wrangler.jsonc` points the asset pipeline at apps/web/dist.
      - name: Build the SPA
        run: bun run --filter @app/web build

      - name: Build the Worker bundle
        working-directory: apps/api
        run: bun run workers:build

      - name: Configure smoke-test variables
        run: cp apps/api/.dev.vars.example apps/api/.dev.vars

      - name: Smoke test on workerd
        run: bun run test:workers

  deploy:
    name: deploy to cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: smoke-local
    # Manual only. A push must never publish: this repository is a template,
    # and the Worker it deploys is a live, publicly reachable app.
    if: github.event_name == 'workflow_dispatch'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # The `secrets` context cannot be read from a job-level `if`, so the
      # credential check is a step. Without it the job would fail deep inside
      # wrangler with a less obvious message.
      - name: Require Cloudflare credentials
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be available to this repository"
          exit 1

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the SPA
        run: bun run --filter @app/web build

      # The bucket named in wrangler.toml has to exist before the binding
      # resolves. Creating it twice is not an error worth failing on.
      - name: Ensure the R2 bucket exists
        working-directory: apps/api
        run: |
          bucket="$(grep -oP 'bucket_name = "\K[^"]+' wrangler.toml)"
          bunx wrangler r2 bucket create "$bucket" 2>&1 | tee /tmp/bucket.log ||             grep -qiE "already (exists|owned)" /tmp/bucket.log

      # Credentials are minted before the deploy and travel as `vars`, not as
      # secrets. `wrangler secret` publishes a version of its own, which turns
      # "deploy, then set secrets" into two versions and a question of which
      # one serves; a var is part of the same deploy and there is nothing to
      # sequence. The value here is a password hash, and the password behind
      # it is random per run and never printed.
      - name: Mint smoke-test credentials
        id: creds
        working-directory: apps/api
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 24)"
          username="smoke-${{ github.run_id }}"
          # Written to a file rather than captured from stdout: anything the
          # runtime decides to print would otherwise be appended to the hash,
          # and a hash with trailing junk still passes the format check at
          # boot while failing every login.
          SMOKE_PW="$password" bun -e '
            const mod = await import("./src/modules/account/auth/password.ts");
            const pw = process.env.SMOKE_PW;
            if (!pw) {
              console.error("SMOKE_PW was empty");
              process.exit(1);
            }
            const hashed = await mod.hashPassword(pw);
            if (!(await mod.verifyPassword(pw, hashed))) {
              console.error("generated hash does not verify against its own password");
              process.exit(1);
            }
            await Bun.write("/tmp/smoke-hash.txt", hashed);
          '
          hash="$(cat /tmp/smoke-hash.txt)"
          rm -f /tmp/smoke-hash.txt
          # Structure only — lengths and field count carry no secret material.
          echo "hash length ${#hash}, fields $(echo "$hash" | awk -F'$' '{print NF}')"

          # `[vars]` is the last table in the file, so appending extends it.
          {
            echo "SINGLE_USER_MODE = \"true\""
            echo "SINGLE_USER_USERNAME = \"$username\""
            echo "SINGLE_USER_PASSWORD_HASH = \"$hash\""
          } >> wrangler.toml

          echo "::add-mask::$password"
          echo "password=$password" >> "$GITHUB_OUTPUT"
          echo "username=$username" >> "$GITHUB_OUTPUT"

      - name: Deploy
        id: deploy
        working-directory: apps/api
        run: |
          set -euo pipefail
          bunx wrangler deploy 2>&1 | tee /tmp/deploy.log
          url="$(grep -oE 'https://[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev' /tmp/deploy.log | head -1)"
          if [ -z "$url" ]; then
            echo "::error::could not parse the deployed URL from wrangler output"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"

      # The edge takes a moment to serve the new version, and the object has
      # to notice its configuration changed and reset. The gate is the
      # precondition the suite needs: these credentials log in.
      - name: Wait for the new credentials to serve
        env:
          SMOKE_USERNAME: ${{ steps.creds.outputs.username }}
          SMOKE_PASSWORD: ${{ steps.creds.outputs.password }}
        run: |
          url="${{ steps.deploy.outputs.url }}"
          echo "user $SMOKE_USERNAME, password length ${#SMOKE_PASSWORD}"
          last=""
          # Ten attempts: the single-user lockout trips at ten failures, so
          # hammering past that only turns a diagnosable 401 into an opaque
          # 429. Each status is logged.
          for _ in $(seq 1 10); do
            last="$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H 'Content-Type: application/json' -H 'X-Requested-With: XMLHttpRequest' \
              -H "Origin: $url" \
              --data "$(jq -n --arg u "$SMOKE_USERNAME" --arg p "$SMOKE_PASSWORD" '{username:$u,password:$p}')" \
              "$url/api/account/auth/login-local")"
            echo "login -> $last"
            [ "$last" = "200" ] && exit 0
            sleep 4
          done
          echo "::error::the minted credentials never logged in (last status $last)"
          exit 1

      - name: Smoke test the deployment
        env:
          SMOKE_USERNAME: ${{ steps.creds.outputs.username }}
          SMOKE_PASSWORD: ${{ steps.creds.outputs.password }}
        run: bun tests/workers/smoke.ts --url "${{ steps.deploy.outputs.url }}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Cloudflare deployment"
            echo
            echo "- URL: ${{ steps.deploy.outputs.url }}"
            echo "- Durable Object: \`AppDurableObject\` (SQLite)"
            echo "- Storage: R2"
          } >> "$GITHUB_STEP_SUMMARY"
