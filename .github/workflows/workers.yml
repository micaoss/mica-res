name: workers

# Cloudflare Workers is the secondary runtime: the app also runs on a single
# Durable Object that owns its SQLite database (see docs/develop/runtime.md).
# This workflow proves that target still works.
#
#  - `smoke-local` always runs. It boots the Worker in workerd through
#    `wrangler dev`, so it needs no Cloudflare account.
#  - `deploy` is manual (workflow_dispatch only). It deploys to Cloudflare
#    and runs the same suite against the live URL. A push never publishes.

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "tests/workers/**"
      - ".github/workflows/workers.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "tests/workers/**"
      - ".github/workflows/workers.yml"
  workflow_dispatch:

concurrency:
  group: workers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.2"
  NODE_VERSION: "24.21.0"

jobs:
  smoke-local:
    name: workerd smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The migrations bundle is committed; a stale one would make the
      # Worker run a different schema than the Bun build.
      - name: Check the Durable Object migrations bundle is current
        working-directory: apps/api
        run: bun run db:check-migrations

      # `wrangler.jsonc` points the asset pipeline at apps/web/dist.
      - name: Build the SPA
        run: bun run --filter @app/web build

      - name: Build the Worker bundle
        working-directory: apps/api
        run: bun run workers:build

      - name: Configure smoke-test variables
        run: cp apps/api/.dev.vars.example apps/api/.dev.vars

      - name: Smoke test on workerd
        run: bun run test:workers

  deploy:
    name: deploy to cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: smoke-local
    # Manual only. A push must never publish: this repository is a template,
    # and the Worker it deploys is a live, publicly reachable app.
    if: github.event_name == 'workflow_dispatch'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # The `secrets` context cannot be read from a job-level `if`, so the
      # credential check is a step. Without it the job would fail deep inside
      # wrangler with a less obvious message.
      - name: Require Cloudflare credentials
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be available to this repository"
          exit 1

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the SPA
        run: bun run --filter @app/web build

      # The bucket named in wrangler.toml has to exist before the binding
      # resolves. Creating it twice is not an error worth failing on.
      - name: Ensure the R2 bucket exists
        working-directory: apps/api
        run: |
          bucket="$(grep -oP 'bucket_name = "\K[^"]+' wrangler.toml)"
          bunx wrangler r2 bucket create "$bucket" 2>&1 | tee /tmp/bucket.log ||             grep -qiE "already (exists|owned)" /tmp/bucket.log

      - name: Deploy
        id: deploy
        working-directory: apps/api
        run: |
          set -euo pipefail
          bunx wrangler deploy 2>&1 | tee /tmp/deploy.log
          url="$(grep -oE 'https://[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev' /tmp/deploy.log | head -1)"
          if [ -z "$url" ]; then
            echo "::error::could not parse the deployed URL from wrangler output"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"

      # Single-user credentials for the smoke test, minted per run. The
      # password is never printed and never committed, so the deployment is
      # not left reachable with a known login. Rotate it with
      # `wrangler secret put SINGLE_USER_PASSWORD_HASH` to take it over.
      - name: Mint smoke-test credentials
        id: creds
        working-directory: apps/api
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 24)"
          hash="$(bun -e '
            const { hashPassword } = await import("./src/modules/account/auth/password.ts");
            process.stdout.write(await hashPassword(process.argv[1]));
          ' "$password")"
          jq -n --arg h "$hash" '{
            SINGLE_USER_MODE: "true",
            SINGLE_USER_USERNAME: "smoke",
            SINGLE_USER_PASSWORD_HASH: $h
          }' > /tmp/worker-secrets.json
          bunx wrangler secret bulk /tmp/worker-secrets.json
          rm -f /tmp/worker-secrets.json
          echo "::add-mask::$password"
          echo "password=$password" >> "$GITHUB_OUTPUT"

      # `secret bulk` rolls out a new version; until it lands the previous one
      # is still serving and single-user login answers 404.
      - name: Wait for the new version to serve
        run: |
          url="${{ steps.deploy.outputs.url }}"
          for _ in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H 'Content-Type: application/json' -H 'X-Requested-With: XMLHttpRequest' \
              -H "Origin: $url" -d '{"username":"smoke","password":"x"}' \
              "$url/api/account/auth/login-local")"
            [ "$code" != "404" ] && exit 0
            sleep 2
          done
          echo "::error::single-user login never came up after the secret rollout"
          exit 1

      - name: Smoke test the deployment
        env:
          SMOKE_USERNAME: smoke
          SMOKE_PASSWORD: ${{ steps.creds.outputs.password }}
        run: bun tests/workers/smoke.ts --url "${{ steps.deploy.outputs.url }}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Cloudflare deployment"
            echo
            echo "- URL: ${{ steps.deploy.outputs.url }}"
            echo "- Durable Object: \`AppDurableObject\` (SQLite)"
            echo "- Storage: R2"
          } >> "$GITHUB_STEP_SUMMARY"
