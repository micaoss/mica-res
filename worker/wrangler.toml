# res.micaos.dev. Deployed by .github/workflows/infra.yml; the bucket is
# private and reachable only through this Worker.
name = "mica-res"
main = "src/index.ts"
compatibility_date = "2026-09-16"
workers_dev = true

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "res-micaos-dev"

[[routes]]
pattern = "res.micaos.dev"
custom_domain = true
